# plugins
plugins:
  - blog:
      # enabled: !ENV CI
      blog_dir: contents/knit
      post_dir: contents/knit/posts
      blog_toc: true
      post_date_format: full
      post_url_format: "{date}/{slug}"
      # post_readtime_words_per_minute: 200
      archive_toc: true
      archive_name: Entries By Time
      archive_date_format: MMMM, yyyy
      archive_url_format: "{date}"
      categories_name: Entries By Topic
      categories_url_format: "{slug}"
      categories_toc: true
      #authors_file: "{blog}/.authors.yml"
  - blog:
      blog_dir: contents/astro
      post_dir: contents/astro/posts
      blog_toc: true
      post_date_format: full
      post_url_format: "{date}/{slug}"
      #post_readtime_words_per_minute: 200
      # archive_toc: true
      archive_name: Entries By Time
      archive_date_format: MMMM, yyyy
      archive_url_format: "{date}"
      categories_name: Entries by Topic
      categories_url_format: "{slug}"
      categories_toc: true
  - blog:
      blog_dir: contents/tech
      post_dir: contents/tech/posts
      blog_toc: true
      post_date_format: full
      post_url_format: "{date}/{slug}"
      #post_readtime_words_per_minute: 200
      # archive_toc: true
      archive_name: Entries By Time
      archive_date_format: MMMM, yyyy
      archive_url_format: "{date}"
      categories_name: Entries by Topic
      categories_url_format: "{slug}"
      categories_toc: true
  # - git-committers:
  #   enabled: !ENV [CI, false]
  #   repository: gh-ka/whatnot
  #   branch: main
  - glightbox
  - minify_html 
  # - minify:
  #     minify_html: true
  - mkdocstrings:
      handlers:
        python:
          options:
            members_order: alphabetical
            allow_inspection: true
            show_bases: true
          paths: [..]
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

