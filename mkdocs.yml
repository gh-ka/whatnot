# global settings
site_name: WhatNot
site_author: gh-ka
site_description: >-
  Collecting bits and bytes
repo_name: gh-ka/whatnot
repo_url: https://github.com/gh-ka/whatnot
site_url: https://gh-ka.co/
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024 gh-ka 

# use_directory_urls: false
# watch:
#   - tools

# theme
theme:
  name: material
  custom_dir: docs/_overrides       # customization
  favicon: assets/favicon.ico  
  palette:  
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  
  font:
    text: Roboto
    code: Roboto Mono
  
  icon:                       # various icons used 
    repo: fontawesome/brands/github
    edit: material/pencil 
    view: material/eye  
    logo: logo
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
      annotation: material/arrow-right-circle
  logo: assets/favicon.ico
  logo_bottom: assets/favicon.ico

  features:                     # get to know them :-)
    - announce.dismiss          # allow the viewer to close announcement bar
    - content.action.edit       # enable editing the content source   
    - content.action.view       # enable viewing the source
    - content.code.annotate     # enable code block annotate (?)
    - content.code.copy         # enable code block copy
    - content.code.select       # enable code block select (?)
    - content.tabs.link         # link all tabs in the page
    - content.tooltips          # (?)
    - content.footnote.tooltips # (?)
    - header.autohide           # (?)
    - navigation.expand
    - navigation.footer
    - navigation.indexes      # for blog indeces
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs         # tabs as content dividers
    - navigation.tabs.sticky  # tabs always visible
    - navigation.top          # show back-to-top button
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# markdown extensions
markdown_extensions:
  - abbr
  - admonition  # https://squidfunk.github.io/mkdocs-material/reference/admonitions
  # annotations
  # https://squidfunk.github.io/mkdocs-material/reference/annotations/
  # to turn links into buttons: [Send :fontawesome-solid-paper-plane:](#){ .md-button }
  - attr_list   
  - def_list
  - footnotes
  - md_in_html  # for annotations
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic     # was in my version
  - pymdownx.details    # needed for admonitions 
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight: # for codeblocks
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite # for codeblocks
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: jxnl 
      repo: instructor
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets: # for codeblocks
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:    # for admonitions, annotations, content tabs, and codeblocks
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        # - name: md-render
        #   class: md-render
        #   format: !!python/name:tools.pymdownx_md_render.md_sub_render
        # - name: csv-path
        #   class: csv-path
        #   format: !!python/name:tools.pymdownx_md_render.md_csv_path_render
  - pymdownx.tabbed: # needed for content tabs
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - tables  # just to be sure, tables are enabled by default
  - toc:
      # baselevel: 2
      permalink: true
      separator: "_"      # ? was in my version

